name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
        with:
          managed: 'false'
          uv-version: '0.13.5'
      # Preserve the existing interpreter channel until its ordinary proposal qualifies.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .github/.python-version
      - name: Prepare the unchanged requirements
        id: dependencies
        run: just setup-backend
      - name: Parse source and run the existing mocked suite
        id: project
        run: |
          just check-python
          just test
      - uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
        if: always()
        with:
          status: ${{ job.status }}
          project-outcome: ${{ steps.dependencies.outcome == 'failure' && 'failure' || steps.project.outcome }}
          task: backend synthetic qualification
          name: backend

  frontend:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
    permissions:
      contents: read
    with:
      prepare: setup-frontend
      recipe: build
      hosted-runner: ubuntu-24.04
      node-version: '24.21.0'
      bun-version: '1.4.4'
      timeout-minutes: 15

  hadolint:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
    permissions:
      contents: read
    with:
      recipe: check-docker
      hosted-runner: ubuntu-24.04
      tool-assets: .github/ci-container-tools.json
      timeout-minutes: 10

  semgrep:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
    permissions:
      contents: read
    with:
      recipe: scan
      hosted-runner: ubuntu-24.04
      uv-version: '0.13.5'
      timeout-minutes: 15

  workflows:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
    permissions:
      contents: read
    with:
      recipe: check-workflows
      hosted-runner: ubuntu-24.04
      fetch-depth: 0
      tools: zizmor@1.32.0,shellcheck@0.11.0
      tool-assets: .github/ci-tools.json
      timeout-minutes: 10

  merge-stops:
    if: github.event_name == 'pull_request'
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/merge-stops.yml@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
    permissions:
      contents: read

  gate:
    name: gate
    needs: [backend, frontend, hadolint, semgrep, workflows, merge-stops]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every actual source, native and security producer
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED: >-
            {"backend":"success","frontend":"success","hadolint":"success","semgrep":"success","workflows":"success","merge-stops":"${{ github.event_name == 'pull_request' && 'success' || 'skipped' }}"}
        run: jq -e --argjson want "$EXPECTED" 'map_values(.result) == $want' <<< "$NEEDS"
