name: CI

# Consolidated CI for local-llm-prompt-optimizer. Replaces the previous
# ad-hoc ci.yml / code-quality.yml / docker.yml / performance.yml workflows.
# Backend delegates to python-ci; frontend delegates to node-ci (Bun). Both are
# pinned reusable workflows from NDDev-it-com/ci-workflows@<pinned-sha>.
#
# NOTE: This is an archived repo. Consolidation intentionally drops Codecov,
# SonarCloud, Locust, memory profiling, Lighthouse, Docker build/load tests,
# and bandit reports (replaced by the security.yml suite). These integrations
# were mostly disabled or advisory already.

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  backend:
    name: Backend (Python)
    uses: NDDev-it-com/ci-workflows/.github/workflows/python-ci.yml@b05016e27151e2d5b3f07e1d856fff50f635ab15
    with:
      python_version: '3.11'
      working_directory: './backend'
      # requirements.txt (no pyproject/uv.lock in this repo); uv provides the env.
      install_command: 'uv pip install --system -r requirements.txt'
      # Lint (flake8), type-check (mypy, advisory), then run the pytest suite
      # with the env vars the app config expects (mocked external deps in tests).
      test_command: >-
        flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics;
        mypy src --ignore-missing-imports --no-strict-optional || true;
        DATABASE_URL='sqlite:///test.db' LM_STUDIO_BASE_URL='http://localhost:1234/v1' pytest tests/ -v --tb=short

  frontend:
    name: Frontend (Node/Bun)
    uses: NDDev-it-com/ci-workflows/.github/workflows/node-ci.yml@b05016e27151e2d5b3f07e1d856fff50f635ab15
    with:
      working_directory: './frontend'
      # npm project (package-lock.json) executed under Bun as a build smoke test.
      install_command: 'bun install --no-save'
      # Runs the repo's build script (tsc && vite build) via Bun.
      test_command: 'bun run build'
