name: Security

# Consolidated security suite for local-llm-prompt-optimizer (public repo).
# Replaces the previous ad-hoc security.yml. Each job delegates to a
# digest-pinned reusable workflow from NDDev-it-com/ci-workflows@<pinned-sha>.
#
# Replaces: CodeQL (now public-codeql), dependency-review (now
# public-dependency-review), bandit + trivy secret scan (now secret-scan +
# semgrep). Dockerfile linting is added via hadolint.

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  codeql:
    name: CodeQL
    uses: NDDev-it-com/ci-workflows/.github/workflows/public-codeql.yml@c26c516559c01166a35b852c0d2a925cc1bd8db8
    with:
      languages: '["python","javascript"]'
      queries: 'security-and-quality'
    permissions:
      actions: read
      contents: read
      security-events: write

  secret-scan:
    name: Secret scan (gitleaks)
    uses: NDDev-it-com/ci-workflows/.github/workflows/secret-scan.yml@c26c516559c01166a35b852c0d2a925cc1bd8db8
    permissions:
      contents: read

  actionlint:
    name: actionlint
    uses: NDDev-it-com/ci-workflows/.github/workflows/actionlint.yml@c26c516559c01166a35b852c0d2a925cc1bd8db8
    permissions:
      contents: read

  zizmor-sarif:
    name: zizmor (SARIF)
    uses: NDDev-it-com/ci-workflows/.github/workflows/zizmor-sarif.yml@c26c516559c01166a35b852c0d2a925cc1bd8db8
    permissions:
      actions: read
      contents: read
      security-events: write

  dependency-review:
    name: Dependency review
    uses: NDDev-it-com/ci-workflows/.github/workflows/public-dependency-review.yml@c26c516559c01166a35b852c0d2a925cc1bd8db8
    permissions:
      contents: read
      pull-requests: write

  hadolint:
    name: hadolint (Dockerfiles)
    uses: NDDev-it-com/ci-workflows/.github/workflows/hadolint-ci.yml@c26c516559c01166a35b852c0d2a925cc1bd8db8
    with:
      # Lint every Dockerfile in the tree (backend, frontend, telegram-bot).
      recursive: true

  semgrep:
    name: semgrep (SAST)
    uses: NDDev-it-com/ci-workflows/.github/workflows/semgrep-ci.yml@c26c516559c01166a35b852c0d2a925cc1bd8db8
    with:
      config: 'p/ci'
